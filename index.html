<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Revamp Motors · Miami used cars, revamped</title>
<meta name="description" content="Every car personally inspected, priced to the market, sold with the full story. Out-the-door numbers, in English or Spanish. Miami, FL.">
<link rel="icon" href="assets/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@700;800;900&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F6EDDC}</style>
</helmet>
<div>
  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}"><dc-import name="Website" hint-size="100%,100vh"></dc-import></sc-if>
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}"><dc-import name="Mobile-Website" hint-size="100%,100vh"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mobile: window.matchMedia('(max-width: 1023px)').matches };
  componentDidMount() {
    this.mq = window.matchMedia('(max-width: 1023px)');
    this.onMQ = (e) => this.setState({ mobile: e.matches });
    this.mq.addEventListener ? this.mq.addEventListener('change', this.onMQ) : this.mq.addListener(this.onMQ);
  }
  componentWillUnmount() {
    this.mq.removeEventListener ? this.mq.removeEventListener('change', this.onMQ) : this.mq.removeListener(this.onMQ);
  }
  renderVals() {
    return { isMobile: this.state.mobile, isDesktop: !this.state.mobile };
  }
}
</script>
</body>
</html>
