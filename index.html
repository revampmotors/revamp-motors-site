<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mobile: window.matchMedia('(max-width: 1023px)').matches };
  componentDidMount() {
    this.mq = window.matchMedia('(max-width: 1023px)');
    this.onMQ = (e) => this.setState({ mobile: e.matches });
    this.mq.addEventListener ? this.mq.addEventListener('change', this.onMQ) : this.mq.addListener(this.onMQ);
  }
  componentWillUnmount() {
    this.mq.removeEventListener ? this.mq.removeEventListener('change', this.onMQ) : this.mq.removeListener(this.onMQ);
  }
  renderVals() { return { isMobile: this.state.mobile, isDesktop: !this.state.mobile }; }
}
</script>
<script>

  var boot = document.getElementById('boot');
  var host = document.querySelector('x-dc');
  function ready() {
    if (!boot) return;
    boot.classList.add('off');
    setTimeout(function () { boot && boot.remove(); boot = null; }, 300);
  }
  var mo = new MutationObserver(function () {
    if (host && host.childElementCount && host.getBoundingClientRect().height > 60) { mo.disconnect(); ready(); }
  });
  if (host) mo.observe(host, { childList: true, subtree: true });
  setTimeout(ready, 6000);
})();
</script>
