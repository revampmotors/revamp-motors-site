<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "Do I need an appointment?", "acceptedAnswer": {"@type": "Answer", "text": "No — walk-ins are welcome Mon–Sat 9a–6p. But if you book a test drive, your car is pulled up, cooled down, and ready with the worksheet printed. Appointments always get the car first."}}, {"@type": "Question", "name": "Can my own mechanic inspect the car before I buy?", "acceptedAnswer": {"@type": "Answer", "text": "Please do. Take the car to any licensed shop within reason, or have a mobile inspector meet you here. We"}}, {"@type": "Question", "name": "Are your prices negotiable?", "acceptedAnswer": {"@type": "Answer", "text": "We price to market when the car is listed — usually 94–97% of local comparable sales, and the range is shown on the listing. If a car sits 21 days, the price drops publicly. So no, we do not do the back-and-forth; the posted number is the real number for everyone."}}, {"@type": "Question", "name": "What fees are added on top of the price?", "acceptedAnswer": {"@type": "Answer", "text": "Exactly three things: FL sales tax (+ county surtax), tag/title/registration at state cost, and our flat $499 dealer fee. The full out-the-door worksheet is on every listing before you visit. No doc-fee surprises, no pre-loaded add-ons."}}, {"@type": "Question", "name": "Can you hold a car for me?", "acceptedAnswer": {"@type": "Answer", "text": "A refundable deposit holds any car for 48 hours while you arrange financing or an inspection. Deposits are returned same-day if you pass — no questions, no forms."}}, {"@type": "Question", "name": "What credit score do I need?", "acceptedAnswer": {"@type": "Answer", "text": "There is no cutoff. Strong credit gets shopped to our bank and credit-union partners for the best rate. Thin file or rough history goes through our in-house program — proof of income, proof of residence, and a reasonable down payment. On-time payments are reported, so your score rebuilds while you drive."}}, {"@type": "Question", "name": "Does getting pre-qualified hurt my credit?", "acceptedAnswer": {"@type": "Answer", "text": "No. Pre-qualification is a soft pull — zero score impact. A hard inquiry only happens when you pick a car and submit a full application, and we tell you before it happens."}}, {"@type": "Question", "name": "What do I need to bring to finance?", "acceptedAnswer": {"@type": "Answer", "text": "Driver\\u2019s license, proof of income (recent pay stubs or bank statements), proof of residence (a utility bill works), and your down payment. Financing through your own bank or credit union? Just bring the approval letter — we work with it happily."}}, {"@type": "Question", "name": "How much down payment do I need?", "acceptedAnswer": {"@type": "Answer", "text": "Bank-financed deals can go as low as $0 down with strong credit. In-house deals typically want 10–20% down. Every listing shows an estimated payment; the worksheet shows your real one before you sign anything."}}, {"@type": "Question", "name": "How fast do I really get an offer?", "acceptedAnswer": {"@type": "Answer", "text": "A written offer within 4 business hours of your form or WhatsApp message (Mon–Sat 9a–6p). It is set by a human appraiser, explained line by line, and valid for 7 days."}}, {"@type": "Question", "name": "Do I have to buy a car from you to sell mine?", "acceptedAnswer": {"@type": "Answer", "text": "No. Selling outright is completely fine — you get paid by check or same-day transfer once we verify condition and title. Trading in just adds a tax bonus: FL taxes only the difference between your trade value and the car you buy."}}, {"@type": "Question", "name": "My car isn\\u2019t paid off. Can I still sell it?", "acceptedAnswer": {"@type": "Answer", "text": "Yes — bring your lender\\u2019s payoff letter. We pay the lender directly and hand you the difference. If you owe more than the offer, you cover the gap and we handle the paperwork either way."}}, {"@type": "Question", "name": "What warranty comes with the car?", "acceptedAnswer": {"@type": "Answer", "text": "Every retail car includes a free 30-day / 1,000-mile limited powertrain warranty — engine, transmission, drive axle — in writing on the buyer\\u2019s order. It is automatic; you do not ask for it or pay for it."}}, {"@type": "Question", "name": "What are the extended warranty options?", "acceptedAnswer": {"@type": "Answer", "text": "Optional third-party plans up to 3 years / 36,000 miles, usable at any licensed repair shop — not just ours. Prices are on a printed public sheet, the same for every customer, and nobody at the desk is paid commission to push them."}}, {"@type": "Question", "name": "Something feels off two days after I bought it. Now what?", "acceptedAnswer": {"@type": "Answer", "text": "Call or WhatsApp us first — (786) 881-2283. If it is powertrain, the 30-day warranty covers it. If it is something smaller we missed, bring it by; we would rather fix a $60 issue than lose the review. This is also why we call you a week after delivery."}}]}</script>

    this.mq = window.matchMedia('(max-width: 1023px)');
    this.onMQ = (e) => this.setState({ mobile: e.matches });
    this.mq.addEventListener ? this.mq.addEventListener('change', this.onMQ) : this.mq.addListener(this.onMQ);
  }
  componentWillUnmount() {
    this.mq.removeEventListener ? this.mq.removeEventListener('change', this.onMQ) : this.mq.removeListener(this.onMQ);
  }
  renderVals() { return { isMobile: this.state.mobile, isDesktop: !this.state.mobile }; }
}
</script>

(function () {
  
  var boot = document.getElementById('boot');
  function rendered() {
    return !!document.querySelector('[data-screen-label]') || document.body.scrollHeight > 900;
  }
  function ready() {
    if (!boot) return;
    boot.classList.add('off');
    setTimeout(function () { boot && boot.remove(); boot = null; }, 180);
  }
  if (rendered()) ready();
  var mo = new MutationObserver(function () { if (rendered()) { mo.disconnect(); ready(); } });
  mo.observe(document.body, { childList: true, subtree: true });
  setTimeout(ready, 2500);
})();
</script>
